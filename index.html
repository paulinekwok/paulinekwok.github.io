<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pauline Kwok { Data Strategist & Storyteller } </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-padding-top:78px;}
  body{margin:0;padding:58px 0 0;font-family:'Inter',sans-serif;color:#3a3a3a;background:#fff;}
  .rp-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,0.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:0.5px solid rgba(201,223,218,0.65);box-shadow:0 10px 28px rgba(94,135,136,0.06);padding:16px 48px;display:flex;align-items:center;justify-content:space-between;}
  .rp-nav-logo{font-size:17px;font-weight:600;color:#2a2a2a;letter-spacing:-0.02em;}
  .rp-nav-logo span{color:#8EAFAA;}
  .rp-nav-links{display:flex;gap:30px;align-items:center;}
  .rp-nav-links a{font-size:12px;font-weight:400;color:#5a5a5a;text-decoration:none;cursor:pointer;transition:color 0.2s;}
  .rp-nav-links a:hover{color:#5E8788;}
  .rp-hero{display:grid;grid-template-columns:1fr 2fr;min-height:88vh;position:relative;}
  .rp-hero-left{position:relative;overflow:hidden;background:linear-gradient(160deg,#8FBFBE 0%,#A9D0CC 32%,#C9DFDA 68%,#D9E2DF 100%);background-size:170% 170%;animation:base-sway 18s ease-in-out infinite;}
  .rp-hero-left::before,.rp-hero-left::after{content:'';position:absolute;inset:-42%;background-repeat:no-repeat;background-size:160% 160%,190% 190%,220% 220%;filter:blur(12px);pointer-events:none;will-change:transform,opacity,background-position;}
  .rp-hero-left::before{background:linear-gradient(118deg,rgba(255,255,255,0) 4%,rgba(217,226,223,0.54) 28%,rgba(255,255,255,0) 54%),linear-gradient(238deg,rgba(143,191,190,0) 12%,rgba(143,191,190,0.34) 44%,rgba(143,191,190,0) 76%),linear-gradient(18deg,rgba(255,255,255,0) 20%,rgba(255,255,255,0.22) 48%,rgba(255,255,255,0) 76%);opacity:0.76;animation:silk-wash-a 12s ease-in-out infinite;}
  .rp-hero-left::after{background:linear-gradient(32deg,rgba(255,255,255,0) 10%,rgba(201,223,218,0.38) 42%,rgba(255,255,255,0) 74%),linear-gradient(305deg,rgba(169,208,204,0.36) 0%,rgba(169,208,204,0) 46%,rgba(143,191,190,0.22) 76%,rgba(143,191,190,0) 100%);opacity:0.62;animation:silk-wash-b 16s ease-in-out infinite;}
  @keyframes base-sway{0%{background-position:10% 42%}30%{background-position:70% 32%}62%{background-position:92% 78%}100%{background-position:10% 42%}}
  @keyframes silk-wash-a{0%{transform:translate3d(-18%,-9%,0) scale(1.03) rotate(-7deg);background-position:8% 44%,88% 26%,30% 80%;opacity:0.52}28%{transform:translate3d(7%,5%,0) scale(1.18) rotate(4deg);background-position:66% 32%,30% 74%,78% 38%;opacity:0.82}58%{transform:translate3d(17%,12%,0) scale(1.08) rotate(8deg);background-position:94% 82%,12% 38%,44% 14%;opacity:0.7}100%{transform:translate3d(-18%,-9%,0) scale(1.03) rotate(-7deg);background-position:8% 44%,88% 26%,30% 80%;opacity:0.52}}
  @keyframes silk-wash-b{0%{transform:translate3d(14%,10%,0) scale(1.13) rotate(5deg);background-position:88% 20%,18% 78%;opacity:0.42}38%{transform:translate3d(-11%,14%,0) scale(1.04) rotate(-5deg);background-position:22% 72%,82% 28%;opacity:0.68}72%{transform:translate3d(-16%,-7%,0) scale(1.16) rotate(2deg);background-position:48% 12%,48% 90%;opacity:0.54}100%{transform:translate3d(14%,10%,0) scale(1.13) rotate(5deg);background-position:88% 20%,18% 78%;opacity:0.42}}
  .rp-hero-right{background:#fff;display:flex;flex-direction:column;justify-content:center;padding:72px 40px 72px 220px;}
  .rp-float-card{position:absolute;left:calc(32% - 118px);top:50%;transform:translateY(-50%);background:#fff;border:0.5px solid rgba(201,223,218,0.7);border-radius:14px;padding:36px 28px;text-align:center;width:300px;z-index:10;box-shadow:0 8px 40px rgba(94,135,136,0.13);}
  .rp-avatar{width:160px;height:160px;border-radius:50%;background:linear-gradient(135deg,#C9DFDA 0%,#8EAFAA 100%);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .rp-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .rp-card-name{font-size:18px;font-weight:600;color:#2a2a2a;margin:0 0 4px;letter-spacing:-0.02em;line-height:1.25;white-space:nowrap;}
  .rp-card-divider{width:32px;height:2px;background:#8EAFAA;margin:12px auto 14px;border-radius:2px;}
  .rp-card-role{font-size:11.2px;letter-spacing:0.14em;text-transform:uppercase;color:#789f9a;margin:0 0 8px;font-weight:500;}
  .rp-card-location{font-family:'Cormorant Garamond',serif;font-size:13.5px;color:#7a8a8b;margin:0 0 20px;font-weight:400;}
  .rp-card-socials{display:flex;gap:16px;justify-content:center;}
  .rp-card-socials a{color:#8FBFBE;font-size:19px;text-decoration:none;opacity:0.9;transition:color 0.2s ease,opacity 0.2s ease,transform 0.2s ease;}
  .rp-card-socials a:hover{color:#5fbeaf;opacity:1;transform:translateY(-1px);}
  .rp-hello{font-family:'Inter',sans-serif;font-size:80px;font-weight:700;color:#1a1a1a;line-height:1.0;margin:0 0 12px;letter-spacing:-0.04em;}
  .rp-hero-sub{font-size:15px;font-weight:300;color:#7a8a8b;margin:0 0 32px;}
  .rp-hero-btns{display:flex;gap:12px;margin-bottom:32px;}
  .rp-btn-solid{background:#5E8788;color:#fff;border:none;padding:12px 28px;border-radius:40px;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.2s;}
  .rp-btn-solid:hover{background:#49585A;}
  .rp-btn-solid:disabled{opacity:0.6;cursor:default;}
  .rp-btn-outline{background:transparent;color:#5E8788;border:1.5px solid #8FBFBE;padding:12px 28px;border-radius:40px;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.25s ease,color 0.25s ease,border-color 0.25s ease,box-shadow 0.25s ease,transform 0.25s ease;}
  .rp-btn-outline:hover{background:#C9DFDA;color:#3a5e5e;border-color:#C9DFDA;box-shadow:0 8px 22px rgba(143,191,190,0.18);transform:translateY(-1px);}
  .rp-hero-bio{font-size:12.5px;line-height:1.9;color:#5a5a5a;max-width:420px;}
  .rp-rule{height:0.5px;background:#edeae5;}
  .rp-section{padding:72px 52px;max-width:880px;margin:0 auto;}
  .rp-eyebrow{font-size:10px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:#8EAFAA;margin:0 0 8px;display:flex;align-items:center;gap:10px;}
  .rp-eyebrow::before{content:'';display:inline-block;width:18px;height:0.5px;background:#8fafaa;}
  .rp-h2{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:400;color:#2a2a2a;margin:0 0 44px;line-height:1.1;}
  .rp-exp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .rp-exp-h3{font-size:13px;font-weight:500;color:#3a3a3a;margin:0;}
  .rp-dl-btn{background:#5E8788;color:#fff;border:1px solid transparent;padding:8px 18px;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;display:inline-flex;align-items:center;gap:6px;transition:background 0.25s ease,color 0.25s ease,border-color 0.25s ease,box-shadow 0.25s ease,transform 0.25s ease;}
  .rp-dl-btn:hover{background:#F4F2EE;color:#3f6364;border-color:#A9D0CC;box-shadow:0 8px 22px rgba(94,135,136,0.12);transform:translateY(-1px);}
  .rp-job{border:0.5px solid #edeae5;border-radius:10px;padding:24px 28px;margin-bottom:14px;background:#faf9f7;display:grid;grid-template-columns:168px 1fr;gap:20px;}
  .rp-job-date{font-size:11px;font-weight:500;color:#8EAFAA;margin:0 0 4px;}
  .rp-job-title{font-size:11px;font-weight:600;color:#5E8788;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 3px;}
  .rp-job-co{font-family:'Cormorant Garamond',serif;font-size:15.5px;color:#454545;margin:0 0 2px;font-weight:800;}
  .rp-job-loc{font-size:11px;color:#7a7a7a;margin:0;}
  .rp-job-body{font-size:13px;line-height:1.8;color:#5a5a5a;}
  .rp-job-body ul{margin:0;padding-left:16px;}
  .rp-job-body li{margin-bottom:5px;}
  .rp-skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px;}
  .rp-skill-box{background:#faf9f7;border:0.5px solid #edeae5;border-radius:10px;padding:20px;}
  .rp-skill-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#5E8788;font-weight:500;margin:0 0 12px;}
  .rp-pill{display:inline-block;background:#eef5f4;color:#3a5e5e;font-size:11px;padding:4px 10px;border-radius:20px;margin:0 5px 6px 0;border:0.5px solid #C9DFDA;}
  .rp-proj-card{border:0.5px solid #edeae5;border-radius:10px;overflow:hidden;margin-bottom:14px;display:grid;grid-template-columns:1fr 220px;background:#faf9f7;transition:border-color 0.25s ease,box-shadow 0.25s ease,transform 0.25s ease,background 0.25s ease;}
  .rp-proj-card:hover{border-color:#A9D0CC;background:#fffdf9;box-shadow:0 10px 30px rgba(94,135,136,0.11);transform:translateY(-2px);}
  .rp-proj-body{padding:24px 28px;}
  .rp-proj-num {font-family: 'Cormorant Garamond', serif;font-size: 22px;color: #8EAFAA;margin: 0 0 6px;}
  .rp-proj-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:500;color:#2a2a2a;margin:0 0 2px;}
  .rp-proj-title a{color:#2a2a2a;text-decoration:none;transition:color 0.25s ease;}
  .rp-proj-title a:hover{color:#4f7878;}
  .rp-proj-sub{font-size:10px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#8EAFAA;margin:0 0 14px;}
  .rp-proj-desc{font-size:13px;line-height:1.8;color:#5a5a5a;margin:0;}
  .rp-proj-thumb{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-left:0.5px solid #edeae5;}
  .rp-proj-thumb img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
  .rp-proj-thumb.is-top-left img{object-position:top left;}
  .rp-proj-email-note{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:11px;color:#5E8788;font-weight:500;letter-spacing:0.04em;background:#eef5f4;border:0.5px solid #C9DFDA;border-radius:6px;padding:5px 10px;text-decoration:none;}
  .rp-proj-email-note:hover{background:#C9DFDA;}
  .rp-contact-wrap{position:relative;overflow:hidden;background:linear-gradient(160deg,#F4F2EE 0%,#F4F2EE 18%,#E2ECE9 52%,#D9E2DF 100%);background-size:170% 170%;animation:base-sway 22s ease-in-out infinite;padding:72px 52px;text-align:center;}
  .rp-contact-wrap::before,.rp-contact-wrap::after{content:'';position:absolute;inset:-42%;background-repeat:no-repeat;background-size:160% 160%,190% 190%,220% 220%;filter:blur(14px);pointer-events:none;will-change:transform,opacity,background-position;}
  .rp-contact-wrap::before{background:linear-gradient(126deg,rgba(255,255,255,0) 8%,rgba(244,242,238,0.68) 32%,rgba(255,255,255,0) 58%),linear-gradient(250deg,rgba(143,191,190,0) 18%,rgba(143,191,190,0.26) 48%,rgba(143,191,190,0) 76%),linear-gradient(20deg,rgba(255,255,255,0) 16%,rgba(255,255,255,0.18) 48%,rgba(255,255,255,0) 78%);opacity:0.78;animation:silk-wash-a 14s ease-in-out infinite reverse;}
  .rp-contact-wrap::after{background:linear-gradient(36deg,rgba(255,255,255,0) 12%,rgba(201,223,218,0.32) 46%,rgba(255,255,255,0) 74%),linear-gradient(300deg,rgba(244,242,238,0.46) 0%,rgba(244,242,238,0) 48%,rgba(143,191,190,0.18) 78%,rgba(143,191,190,0) 100%);opacity:0.6;animation:silk-wash-b 18s ease-in-out infinite reverse;}
  .rp-contact-inner{position:relative;z-index:1;max-width:500px;margin:0 auto;}
  .rp-contact-form{background:rgba(255,255,255,0.9);border:0.5px solid rgba(201,223,218,0.6);border-radius:14px;padding:36px;text-align:left;margin-top:36px;}
  .rp-form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px;}
  .rp-form-field{margin-bottom:13px;}
  .rp-form-field label{display:block;font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:#8EAFAA;margin-bottom:7px;}
  .rp-form-field input,.rp-form-field textarea{width:100%;background:#faf9f7;border:0.5px solid #e0dbd3;border-radius:7px;padding:9px 13px;font-size:13px;color:#3a3a3a;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;}
  .rp-form-field input:focus,.rp-form-field textarea:focus{border-color:#8EAFAA;}
  .rp-form-field textarea{resize:vertical;min-height:90px;}
  .rp-form-status{font-size:12px;margin-top:10px;text-align:center;min-height:16px;}
  .rp-form-status.ok{color:#5E8788;}
  .rp-form-status.err{color:#b05c4a;}
  .rp-footer{background:#2a2a2a;padding:28px 52px;display:flex;justify-content:space-between;align-items:center;}
  .rp-footer-copy{font-size:11px;color:rgba(255,255,255,0.35);}
  .rp-footer-cols{display:flex;gap:40px;}
  .rp-footer-col-label{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#8EAFAA;margin:0 0 4px;}
